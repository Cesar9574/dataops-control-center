version: '3.8'

services:
  # Base de datos principal del proyecto
  postgres:
    image: postgres:15
    container_name: dataops_postgres
    environment:
      POSTGRES_DB: dataops_db
      POSTGRES_USER: dataops_user
      POSTGRES_PASSWORD: dataops_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dataops_network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: dataops_redis
    ports:
      - "6379:6379"
    networks:
      - dataops_network

  # Prometheus - recoleccion de metricas
  prometheus:
    image: prom/prometheus:latest
    container_name: dataops_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dataops_network

  # Grafana - visualizacion
  grafana:
    image: grafana/grafana:latest
    container_name: dataops_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - dataops_network

  # Backend Node.js
  backend:
    build: ./backend
    container_name: dataops_backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dataops_db
      DB_USER: dataops_user
      DB_PASSWORD: dataops_pass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dataops_jwt_secret_2024
    depends_on:
      - postgres
      - redis
    networks:
      - dataops_network

  # Frontend React
  frontend:
    build: ./frontend
    container_name: dataops_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dataops_network

networks:
  dataops_network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data: